<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سیستم سئو و تولید محتوا{% endblock %}</title>

    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin: 20px;
            overflow: hidden;
        }

        .sidebar {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: calc(100vh - 40px);
            padding: 20px;
        }

        .sidebar .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            margin: 5px 0;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
            transform: translateX(-5px);
        }

        .sidebar .nav-link i {
            margin-left: 10px;
            width: 20px;
        }

        .content-area {
            padding: 30px;
            min-height: calc(100vh - 40px);
        }

        .page-header {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        .page-header h1 {
            color: #667eea;
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
        }

        .badge {
            padding: 8px 15px;
            border-radius: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .stat-card h3 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            margin: 0;
        }

        .table {
            border-radius: 15px;
            overflow: hidden;
        }

        .table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 10px 15px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .modal-content {
            border-radius: 20px;
            border: none;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }

        .progress {
            height: 25px;
            border-radius: 15px;
        }

        .alert {
            border-radius: 15px;
            border: none;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="main-container">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="logo">
                    <i class="fas fa-rocket"></i> سیستم سئو
                </div>

                <nav class="nav flex-column">
                    <a href="/dashboard" class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}">
                        <i class="fas fa-home"></i> داشبورد
                    </a>
                    <a href="/categories" class="nav-link {% if '/categories' in request.url.path %}active{% endif %}">
                        <i class="fas fa-folder"></i> دسته‌بندی‌ها
                    </a>
                    <a href="/keywords" class="nav-link {% if '/keywords' in request.url.path %}active{% endif %}">
                        <i class="fas fa-search"></i> کلمات کلیدی
                    </a>
                    <a href="/pillar" class="nav-link {% if '/pillar' in request.url.path %}active{% endif %}">
                        <i class="fas fa-project-diagram"></i> Pillar-Cluster
                    </a>
                    <a href="/calendar" class="nav-link {% if '/calendar' in request.url.path %}active{% endif %}">
                        <i class="fas fa-calendar"></i> تقویم محتوایی
                    </a>
                    <a href="/content" class="nav-link {% if '/content' in request.url.path %}active{% endif %}">
                        <i class="fas fa-file-alt"></i> تولید محتوا
                    </a>
                    <a href="/publish" class="nav-link {% if '/publish' in request.url.path %}active{% endif %}">
                        <i class="fas fa-paper-plane"></i> انتشار
                    </a>
                </nav>

                <div class="mt-5 text-center">
                    <small>نسخه 2.0.0</small>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 content-area">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery (optional) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
