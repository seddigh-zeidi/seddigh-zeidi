<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم سئو و تولید محتوای حرفه‌ای</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .welcome-container {
            background: white;
            border-radius: 30px;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 72px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .feature {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            transition: transform 0.3s;
        }

        .feature:hover {
            transform: translateY(-5px);
            background: #e9ecef;
        }

        .feature i {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 50px;
            font-size: 20px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo">
            <i class="fas fa-rocket"></i>
        </div>

        <h1>سیستم سئو و تولید محتوای حرفه‌ای</h1>
        <p class="subtitle">
            راهکار کامل برای تحقیق کلمات کلیدی، برنامه‌ریزی و تولید محتوای سئو شده
        </p>

        <div class="features">
            <div class="feature">
                <i class="fas fa-folder-open"></i>
                <h6>مدیریت دسته‌بندی</h6>
            </div>
            <div class="feature">
                <i class="fas fa-search-plus"></i>
                <h6>تحقیق کلمات کلیدی</h6>
            </div>
            <div class="feature">
                <i class="fas fa-sitemap"></i>
                <h6>Pillar-Cluster</h6>
            </div>
            <div class="feature">
                <i class="fas fa-calendar-alt"></i>
                <h6>تقویم محتوایی</h6>
            </div>
            <div class="feature">
                <i class="fas fa-file-invoice"></i>
                <h6>تولید محتوا</h6>
            </div>
            <div class="feature">
                <i class="fas fa-cloud-upload-alt"></i>
                <h6>انتشار خودکار</h6>
            </div>
        </div>

        <a href="/dashboard" class="btn btn-start">
            <i class="fas fa-play-circle"></i> شروع کار
        </a>

        <div class="mt-5">
            <small class="text-muted">ساخته شده با Python FastAPI ❤️</small>
        </div>
    </div>
</body>
</html>
